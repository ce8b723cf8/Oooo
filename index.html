<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجربة إرسال طلب - EUX</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .form-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #555;
      font-weight: bold;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      background-color: #a0c4ff;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="form-card">
  <h2>إرسال طلب تجريبي</h2>
  
  <form id="testForm">
    <div class="form-group">
      <label>اسم المستلم:*</label>
      <input type="text" id="customerName" placeholder="إبراهيم محمد" required>
    </div>
    
    <div class="form-group">
      <label>هاتف المستلم:*</label>
      <input type="tel" id="customerPhone" placeholder="01119024874" required>
    </div>

    <div class="form-group">
      <label>هاتف آخر:</label>
      <input type="tel" id="customerPhone2" placeholder="اختياري">
    </div>

    <div class="form-group">
      <label>المحافظة:*</label>
      <input type="text" id="governorate" placeholder="القاهرة" required>
    </div>

    <div class="form-group">
      <label>المدينة:*</label>
      <input type="text" id="city" placeholder="مدينة نصر" required>
    </div>

    <div class="form-group">
      <label>العنوان التفصيلي:*</label>
      <input type="text" id="address" placeholder="شارع ..." required>
    </div>

    <div class="form-group">
      <label>المبلغ التحصيل:*</label>
      <input type="number" id="amount" placeholder="500" required>
    </div>

    <div class="form-group">
      <label>الوزن (كجم):</label>
      <input type="text" id="weight" placeholder="1">
    </div>

    <div class="form-group">
      <label>المنتجات المطلوبة:</label>
      <input type="text" id="products" placeholder="قميص أسود">
    </div>

    <div class="form-group">
      <label>السعر الإجمالي:</label>
      <input type="number" id="totalPrice" placeholder="500">
    </div>

    <div class="form-group">
      <label>ملاحظات:</label>
      <input type="text" id="notes" placeholder="ملاحظات الشحن">
    </div>

    <button type="submit" id="btn">إرسال الطلب 🚀</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwDWE1teZ_7w0WIX3f3lTv2m5vcvxoKQVjk9PqWwyH8AWTW4guquPUZWCZctZnrMFFX/exec";

  const form = document.getElementById('testForm');
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "جاري الإرسال...";
    status.style.color = "blue";
    status.textContent = "⏳ جاري إضافة الطلب إلى Google Sheets...";

    const payload = {
      action: "addOrder",
      customerName: document.getElementById('customerName').value,
      customerPhone: document.getElementById('customerPhone').value,
      customerPhone2: document.getElementById('customerPhone2').value,
      governorate: document.getElementById('governorate').value,
      city: document.getElementById('city').value,
      address: document.getElementById('address').value,
      amount: document.getElementById('amount').value,
      weight: document.getElementById('weight').value,
      notes: document.getElementById('notes').value,
      products: document.getElementById('products').value,
      totalPrice: document.getElementById('totalPrice').value
    };

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const resData = await response.json();

      if (resData.success) {
        status.style.color = "green";
        status.textContent = `✅ تم الحفظ بنجاح! رقم الطلب: ${resData.orderId}`;
        form.reset();
      } else {
        status.style.color = "red";
        status.textContent = "❌ خطأ: " + resData.error;
      }
    } catch (err) {
      status.style.color = "red";
      status.textContent = "❌ حدث خطأ أثناء الإرسال.";
    } finally {
      btn.disabled = false;
      btn.textContent = "إرسال الطلب 🚀";
    }
  });
</script>

</body>
</html>
