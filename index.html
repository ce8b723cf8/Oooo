<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تجربة رفع - FreeImage.host</title>
  <style>
    body { font-family:Arial; background:#FDD95A; color:#57080E; text-align:center; padding:30px; }
    .section { background:#FDE35E; border:2px solid #57080E; border-radius:12px; padding:20px; margin:15px auto; max-width:600px; }
    input, button { padding:12px 20px; font-size:16px; margin:10px; border:2px solid #57080E; border-radius:8px; }
    button { background:#57080E; color:#FDD95A; cursor:pointer; font-weight:bold; }
    img { max-width:300px; max-height:300px; border:3px solid #57080E; border-radius:12px; margin-top:15px; display:none; }
    #imageUrl { width:90%; direction:ltr; padding:10px; border:2px solid #57080E; border-radius:8px; font-size:14px; }
    #status { font-weight:bold; margin:10px 0; }
  </style>
</head>
<body>
  <h2>🖼️ تجربة رفع الصور - FreeImage.host</h2>
  
  <div class="section">
    <h3>1️⃣ ارفع صورة</h3>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()">⬆️ رفع الصورة</button>
    <div id="status"></div>
  </div>
  
  <div class="section">
    <h3>2️⃣ الرابط الناتج</h3>
    <input type="text" id="imageUrl" readonly placeholder="سيظهر الرابط هنا...">
    <button onclick="copyUrl()">📋 نسخ الرابط</button>
  </div>
  
  <div class="section">
    <h3>3️⃣ معاينة الصورة</h3>
    <img id="previewImage" alt="معاينة الصورة">
  </div>

  <script>
    const API_KEY = '6d207e02198a847aa98d0a2a901485a5';
    
    function uploadImage() {
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];
      const status = document.getElementById('status');
      
      if(!file) return alert('اختر صورة أولاً');
      
      status.textContent = '⏳ جاري تحويل الصورة...';
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result.split(',')[1]; // إزالة البادئة
        
        status.textContent = '⏳ جاري الرفع...';
        
        // إنشاء نموذج وإرساله عبر iframe مخفي (يتجاوز CORS)
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = 'https://freeimage.host/api/1/upload';
        form.target = iframe.name;
        iframe.name = 'upload_frame';
        
        const keyInput = document.createElement('input');
        keyInput.type = 'hidden';
        keyInput.name = 'key';
        keyInput.value = API_KEY;
        
        const actionInput = document.createElement('input');
        actionInput.type = 'hidden';
        actionInput.name = 'action';
        actionInput.value = 'upload';
        
        const sourceInput = document.createElement('input');
        sourceInput.type = 'hidden';
        sourceInput.name = 'source';
        sourceInput.value = base64;
        
        const formatInput = document.createElement('input');
        formatInput.type = 'hidden';
        formatInput.name = 'format';
        formatInput.value = 'json';
        
        form.appendChild(keyInput);
        form.appendChild(actionInput);
        form.appendChild(sourceInput);
        form.appendChild(formatInput);
        document.body.appendChild(form);
        
        iframe.onload = function() {
          try {
            const response = iframe.contentDocument.body.textContent;
            const data = JSON.parse(response);
            
            if(data.status_code === 200 && data.image) {
              const url = data.image.url;
              document.getElementById('imageUrl').value = url;
              document.getElementById('previewImage').src = url;
              document.getElementById('previewImage').style.display = 'block';
              status.textContent = '✅ تم رفع الصورة بنجاح!';
              status.style.color = 'green';
            } else {
              status.textContent = '❌ فشل الرفع';
              status.style.color = 'red';
            }
          } catch(err) {
            status.textContent = '❌ خطأ: ' + err.message;
            status.style.color = 'red';
          }
          
          document.body.removeChild(iframe);
          document.body.removeChild(form);
        };
        
        form.submit();
      };
      reader.readAsDataURL(file);
    }
    
    function copyUrl() {
      const urlInput = document.getElementById('imageUrl');
      if(!urlInput.value) return alert('لا يوجد رابط للنسخ');
      urlInput.select();
      document.execCommand('copy');
      alert('✅ تم نسخ الرابط');
    }
  </script>
</body>
</html>
