<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كارت استعراضي متحرك كبير</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* الكارت بمقاس مضاعف */
        .card {
            position: relative;
            width: 380px;
            height: 480px;
            border-radius: 20px;
            z-index: 1111;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
        }

        .bg {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 360px;
            height: 460px;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 14px;
            overflow: hidden;
            outline: 2px solid white;
        }

        /* تكبير حجم الـ Blob ليتناسب مع الكارت */
        .blob {
            position: absolute;
            z-index: 1;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background-color: #ff0000;
            opacity: 1;
            filter: blur(16px);
            animation: blob-bounce 6s infinite ease;
        }

        @keyframes blob-bounce {
            0% { transform: translate(-100%, -100%) translate3d(0, 0, 0); }
            25% { transform: translate(-100%, -100%) translate3d(100%, 0, 0); }
            50% { transform: translate(-100%, -100%) translate3d(100%, 100%, 0); }
            75% { transform: translate(-100%, -100%) translate3d(0, 100%, 0); }
            100% { transform: translate(-100%, -100%) translate3d(0, 0, 0); }
        }

        /* عرض الصور */
        .slideshow {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }

        .slideshow img.active {
            opacity: 0.9;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="bg">
            <div class="slideshow" id="slideshow">
                <img src="https://i.pinimg.com/736x/07/17/18/071718c4f4970294f3b63f154ecae1db.jpg" class="active" alt="صورة استعراضية 1">
                <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=800" alt="صورة استعراضية 2">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800" alt="صورة استعراضية 3">
            </div>
        </div>
        <div class="blob"></div>
    </div>

    <script>
        const images = document.querySelectorAll('#slideshow img');
        let currentIndex = 0;

        function changeImage() {
            images[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % images.length;
            images[currentIndex].classList.add('active');
        }

        // التبديل كل 4 ثوانٍ (4000 مللي ثانية)
        setInterval(changeImage, 4000);
    </script>

</body>
</html>
