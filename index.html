<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كارت استعراضي متحرك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* التصميم الخاص بك من Uiverse.io */
        .card {
            position: relative;
            width: 200px;
            height: 250px;
            border-radius: 14px;
            z-index: 1111;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
        }

        .bg {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 190px;
            height: 240px;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25); /* تعديل الشفافية لإظهار الصور بوضوح */
            backdrop-filter: blur(8px); /* تقليل الضباب قليلاً لتفاصيل الصور */
            -webkit-backdrop-filter: blur(8px);
            border-radius: 10px;
            overflow: hidden;
            outline: 2px solid white;
        }

        .blob {
            position: absolute;
            z-index: 1;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #ff0000;
            opacity: 1;
            filter: blur(12px);
            animation: blob-bounce 5s infinite ease;
        }

        @keyframes blob-bounce {
            0% { transform: translate(-100%, -100%) translate3d(0, 0, 0); }
            25% { transform: translate(-100%, -100%) translate3d(100%, 0, 0); }
            50% { transform: translate(-100%, -100%) translate3d(100%, 100%, 0); }
            75% { transform: translate(-100%, -100%) translate3d(0, 100%, 0); }
            100% { transform: translate(-100%, -100%) translate3d(0, 0, 0); }
        }

        /* عناصر عرض الصور والأنيميشن الخاص بها */
        .slideshow {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.08);
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        /* الصورة النشطة حالياً */
        .slideshow img.active {
            opacity: 0.85; /* درجة الشفافية لدمج الصورة مع خلفية الزجاج */
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="bg">
            <div class="slideshow" id="slideshow">
                <!-- يمكنك إضافة أو تغيير روابط الصور من هنا -->
                <img src="https://i.pinimg.com/736x/07/17/18/071718c4f4970294f3b63f154ecae1db.jpg" class="active" alt="صورة استعراضية 1">
                <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=600" alt="صورة استعراضية 2">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=600" alt="صورة استعراضية 3">
            </div>
        </div>
        <div class="blob"></div>
    </div>

    <script>
        const images = document.querySelectorAll('#slideshow img');
        let currentIndex = 0;

        function changeImage() {
            // إخفاء الصورة الحالية
            images[currentIndex].classList.remove('active');
            
            // الانتقال للصورة التالية (أو العودة للأولى عند الوصول للنهاية)
            currentIndex = (currentIndex + 1) % images.length;
            
            // إظهار الصورة الجديدة
            images[currentIndex].classList.add('active');
        }

        // التبديل تلقائياً كل ثانيتين (2000 مللي ثانية)
        setInterval(changeImage, 2000);
    </script>

</body>
</html>
