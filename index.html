<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>اختبار بسيط - Google Sheets</title>
</head>
<body style="font-family:Arial;text-align:center;padding:50px;direction:rtl;">

  <h1>🧪 اختبار إرسال طلب</h1>
  
  <form id="testForm">
    <input type="text" id="name" placeholder="الاسم" value="اختبار" style="padding:10px;width:300px;margin:5px;">
    <br>
    <input type="text" id="phone" placeholder="الهاتف" value="01012345678" style="padding:10px;width:300px;margin:5px;">
    <br>
    <input type="text" id="gov" placeholder="المحافظة" value="القاهرة" style="padding:10px;width:300px;margin:5px;">
    <br>
    <input type="text" id="city" placeholder="المدينة" value="مدينة نصر" style="padding:10px;width:300px;margin:5px;">
    <br>
    <input type="text" id="address" placeholder="العنوان" value="شارع 90" style="padding:10px;width:300px;margin:5px;">
    <br>
    <input type="text" id="amount" placeholder="المبلغ" value="100" style="padding:10px;width:300px;margin:5px;">
    <br>
    <button type="submit" style="padding:15px 50px;background:#0076ff;color:white;border:none;border-radius:8px;font-size:18px;margin-top:10px;cursor:pointer;">
      إرسال
    </button>
  </form>

  <div id="result" style="margin-top:20px;padding:15px;border-radius:8px;display:none;"></div>

  <script>
    document.getElementById('testForm').onsubmit = async function(e) {
      e.preventDefault();
      
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.style.background = '#fff3cd';
      resultDiv.style.border = '2px solid #ffc107';
      resultDiv.innerHTML = '⏳ جاري الإرسال...';

      const data = {
        action: 'addOrder',
        customerName: document.getElementById('name').value,
        customerPhone: document.getElementById('phone').value,
        governorate: document.getElementById('gov').value,
        city: document.getElementById('city').value,
        address: document.getElementById('address').value,
        amount: document.getElementById('amount').value,
        weight: '1',
        notes: 'اختبار'
      };

      try {
        const res = await fetch('https://script.google.com/macros/s/AKfycbxdhsaiJDo9RvwZcljGxmgbMpkyR96at3SaRZBCdvQYIhZySLPLR-bODSf6kyDJ90Gu/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        console.log(result);

        if (result.success) {
          resultDiv.style.background = '#d4edda';
          resultDiv.style.border = '2px solid #28a745';
          resultDiv.innerHTML = '✅ تم الإرسال! رقم الطلب: ' + (result.orderId || 'غير معروف');
        } else {
          resultDiv.style.background = '#f8d7da';
          resultDiv.style.border = '2px solid #dc3545';
          resultDiv.innerHTML = '❌ فشل: ' + (result.error || 'خطأ غير معروف');
        }
      } catch(err) {
        resultDiv.style.background = '#f8d7da';
        resultDiv.style.border = '2px solid #dc3545';
        resultDiv.innerHTML = '❌ خطأ: ' + err.message;
      }
    };
  </script>

</body>
</html>
