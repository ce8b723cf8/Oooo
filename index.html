<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تجربة رفع الصور - FreeImage.host (fetch)</title>
  <style>
    body { font-family:Arial; background:#FDD95A; color:#57080E; text-align:center; padding:30px; }
    .section { background:#FDE35E; border:2px solid #57080E; border-radius:12px; padding:20px; margin:15px auto; max-width:600px; }
    input, button { padding:12px 20px; font-size:16px; margin:10px; border:2px solid #57080E; border-radius:8px; }
    button { background:#57080E; color:#FDD95A; cursor:pointer; font-weight:bold; }
    button:hover { background:#6A1017; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    img { max-width:200px; max-height:200px; border:3px solid #57080E; border-radius:12px; margin:5px; display:inline-block; }
    #status { font-weight:bold; margin:10px 0; }
    .preview-container { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
  </style>
</head>
<body>
  <h2>🖼️ تجربة رفع الصور - FreeImage.host</h2>
  
  <div class="section">
    <h3>1️⃣ ارفع صور</h3>
    <input type="file" id="imageInput" accept="image/*" multiple>
    <button onclick="uploadImages()" id="uploadBtn">⬆️ رفع الصور</button>
    <div id="status"></div>
  </div>
  
  <div class="section">
    <h3>2️⃣ الصور المرفوعة</h3>
    <div class="preview-container" id="previewContainer"></div>
  </div>
  
  <div class="section">
    <h3>3️⃣ الروابط</h3>
    <div id="urlsContainer" style="direction:ltr;text-align:left;"></div>
  </div>

  <script>
    const API_KEY = '6d207e02198a847aa98d0a2a901485a5';
    
    async function uploadImages() {
      const fileInput = document.getElementById('imageInput');
      const files = fileInput.files;
      const status = document.getElementById('status');
      const previewContainer = document.getElementById('previewContainer');
      const urlsContainer = document.getElementById('urlsContainer');
      const uploadBtn = document.getElementById('uploadBtn');
      
      if(files.length === 0) return alert('اختر صوراً أولاً');
      
      previewContainer.innerHTML = '';
      urlsContainer.innerHTML = '';
      status.textContent = '⏳ جاري رفع الصور...';
      status.style.color = '#57080E';
      uploadBtn.disabled = true;
      
      const urls = [];
      
      for(let i = 0; i < files.length; i++) {
        try {
          status.textContent = `⏳ جاري رفع الصورة ${i+1} من ${files.length}...`;
          
          const formData = new FormData();
          formData.append('key', API_KEY);
          formData.append('action', 'upload');
          formData.append('source', files[i]);
          formData.append('format', 'json');
          
          const response = await fetch('https://freeimage.host/api/1/upload', {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          console.log('الرد:', data);
          
          if(data.status_code === 200 && data.image) {
            urls.push(data.image.url);
            
            const img = document.createElement('img');
            img.src = data.image.url;
            img.alt = 'صورة مرفوعة';
            previewContainer.appendChild(img);
            
            const urlDiv = document.createElement('div');
            urlDiv.textContent = data.image.url;
            urlDiv.style.cssText = 'font-size:12px;margin:5px 0;word-break:break-all;';
            urlsContainer.appendChild(urlDiv);
            
            status.textContent = `✅ تم رفع ${urls.length} من ${files.length} صورة`;
            status.style.color = 'green';
          } else {
            throw new Error(data.status_txt || 'فشل الرفع');
          }
        } catch(e) {
          console.error(e);
          status.textContent = `❌ فشل رفع الصورة ${i+1}: ${e.message}`;
          status.style.color = 'red';
        }
      }
      
      uploadBtn.disabled = false;
      status.textContent = `✅ اكتمل الرفع. تم رفع ${urls.length} صورة بنجاح`;
      status.style.color = 'green';
      fileInput.value = '';
    }
  </script>
</body>
</html>
