<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجربة إرسال البيانات</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .form-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background-color: #a0c4ff;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="form-card">
  <h2>اختبار Google Sheets</h2>
  
  <form id="testForm">
    <div class="form-group">
      <label>اسم التجربة:</label>
      <input type="text" id="name" placeholder="أدخل اسمك" required>
    </div>
    
    <div class="form-group">
      <label>رقم الهاتف:</label>
      <input type="tel" id="phone" placeholder="010xxxxxxx" required>
    </div>

    <div class="form-group">
      <label>ملاحظة:</label>
      <input type="text" id="note" placeholder="اكتب أي تجربة هنا">
    </div>

    <button type="submit" id="btn">إرسال البيانات 🚀</button>
  </form>

  <div id="status"></div>
</div>

<script>
  // تم ربط الرابط الخاص بك بنجاح
  const API_URL = "https://script.google.com/macros/s/AKfycbwDWE1teZ_7w0WIX3f3lTv2m5vcvxoKQVjk9PqWwyH8AWTW4guquPUZWCZctZnrMFFX/exec";

  const form = document.getElementById('testForm');
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "جاري الإرسال...";
    status.style.color = "blue";
    status.textContent = "⏳ يتم إرسال البيانات إلى Google Sheets...";

    const payload = {
      customerName: document.getElementById('name').value,
      customerPhone: document.getElementById('phone').value,
      address: document.getElementById('note').value,
      action: "addOrder"
    };

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      status.style.color = "green";
      status.textContent = "✅ تم الإرسال بنجاح! تفقد ملف الشيت الآن.";
      form.reset();
    } catch (err) {
      status.style.color = "red";
      status.textContent = "❌ حدث خطأ أثناء الإرسال.";
    } finally {
      btn.disabled = false;
      btn.textContent = "إرسال البيانات 🚀";
    }
  });
</script>

</body>
</html>
