<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تجربة رفع الصور - FreeImage.host</title>
  <style>
    body { font-family:Arial; background:#FDD95A; color:#57080E; text-align:center; padding:30px; }
    .section { background:#FDE35E; border:2px solid #57080E; border-radius:12px; padding:20px; margin:15px auto; max-width:600px; }
    input, button { padding:12px 20px; font-size:16px; margin:10px; border:2px solid #57080E; border-radius:8px; }
    button { background:#57080E; color:#FDD95A; cursor:pointer; font-weight:bold; }
    button:hover { background:#6A1017; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    img { max-width:300px; max-height:300px; border:3px solid #57080E; border-radius:12px; margin-top:15px; display:none; }
    #imageUrl { width:90%; direction:ltr; padding:10px; border:2px solid #57080E; border-radius:8px; font-size:14px; }
    #status { font-weight:bold; margin:10px 0; }
    .spinner { display:none; width:40px; height:40px; margin:20px auto; border:4px solid #FDE35E; border-top:4px solid #57080E; border-radius:50%; animation:spin .8s linear infinite; }
    .spinner.active { display:block; }
    @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  </style>
</head>
<body>
  <h2>🖼️ تجربة رفع الصور - FreeImage.host</h2>
  
  <div class="section">
    <h3>1️⃣ ارفع صورة</h3>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()" id="uploadBtn">⬆️ رفع الصورة</button>
    <div class="spinner" id="spinner"></div>
    <div id="status"></div>
  </div>
  
  <div class="section">
    <h3>2️⃣ الرابط الناتج</h3>
    <input type="text" id="imageUrl" readonly placeholder="سيظهر الرابط هنا...">
    <button onclick="copyUrl()">📋 نسخ الرابط</button>
  </div>
  
  <div class="section">
    <h3>3️⃣ معاينة الصورة</h3>
    <img id="previewImage" alt="معاينة الصورة">
  </div>

  <script>
    const API_KEY = '6d207e02198a847aa98d0a2a901485a5';
    
    async function uploadImage() {
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];
      const status = document.getElementById('status');
      const spinner = document.getElementById('spinner');
      const uploadBtn = document.getElementById('uploadBtn');
      const imageUrl = document.getElementById('imageUrl');
      const previewImage = document.getElementById('previewImage');
      
      if(!file) return alert('اختر صورة أولاً');
      
      // إظهار التحميل
      uploadBtn.disabled = true;
      spinner.classList.add('active');
      status.textContent = '⏳ جاري رفع الصورة...';
      status.style.color = '#57080E';
      
      try {
        const formData = new FormData();
        formData.append('key', API_KEY);
        formData.append('action', 'upload');
        formData.append('source', file);
        formData.append('format', 'json');
        
        const response = await fetch('https://freeimage.host/api/1/upload', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        console.log('الرد الكامل:', data);
        
        if(data.status_code === 200 && data.image) {
          const url = data.image.url;
          imageUrl.value = url;
          previewImage.src = url;
          previewImage.style.display = 'block';
          status.textContent = `✅ تم رفع الصورة بنجاح! (${data.image.size_formatted})`;
          status.style.color = 'green';
        } else {
          status.textContent = '❌ فشل الرفع: ' + (data.status_txt || 'خطأ غير معروف');
          status.style.color = 'red';
        }
      } catch(e) {
        status.textContent = '❌ خطأ في الاتصال: ' + e.message;
        status.style.color = 'red';
        console.error(e);
      } finally {
        uploadBtn.disabled = false;
        spinner.classList.remove('active');
        fileInput.value = '';
      }
    }
    
    function copyUrl() {
      const urlInput = document.getElementById('imageUrl');
      if(!urlInput.value) return alert('لا يوجد رابط للنسخ');
      urlInput.select();
      urlInput.setSelectionRange(0, 99999);
      document.execCommand('copy');
      alert('✅ تم نسخ الرابط');
    }
  </script>
</body>
</html>
