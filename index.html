<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تجربة رفع صورة لرابط مؤقت</title>
  <style>
    body { font-family:Arial; background:#FDD95A; color:#57080E; text-align:center; padding:30px; }
    .section { background:#FDE35E; border:2px solid #57080E; border-radius:12px; padding:20px; margin:15px auto; max-width:600px; }
    input, button { padding:12px 20px; font-size:16px; margin:10px; border:2px solid #57080E; border-radius:8px; }
    button { background:#57080E; color:#FDD95A; cursor:pointer; font-weight:bold; }
    button:hover { background:#6A1017; }
    img { max-width:300px; max-height:300px; border:3px solid #57080E; border-radius:12px; margin-top:15px; display:none; }
    #imageUrl { width:90%; direction:ltr; padding:10px; border:2px solid #57080E; border-radius:8px; font-size:14px; }
    #previewSection { display:none; }
  </style>
</head>
<body>
  <h2>🖼️ تجربة رفع صورة للحصول على رابط</h2>
  
  <div class="section">
    <h3>1️⃣ ارفع الصورة</h3>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()">⬆️ رفع الصورة</button>
    <div id="uploadResult"></div>
  </div>
  
  <div class="section" id="previewSection">
    <h3>2️⃣ الرابط الناتج (انسخه)</h3>
    <input type="text" id="imageUrl" readonly>
    <button onclick="copyUrl()">📋 نسخ الرابط</button>
  </div>
  
  <div class="section">
    <h3>3️⃣ الصق الرابط هنا لعرض الصورة</h3>
    <input type="text" id="pasteUrl" placeholder="الصق الرابط هنا..." style="width:80%;">
    <button onclick="showImage()">👁️ عرض الصورة</button>
    <br>
    <img id="displayImage" alt="معاينة الصورة">
  </div>

  <script>
    function uploadImage() {
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];
      
      if(!file) return alert('اختر صورة أولاً');
      
      // تحويل الصورة إلى Base64 (رابط مؤقت في الذاكرة فقط)
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        
        // عرض الرابط
        document.getElementById('imageUrl').value = base64;
        document.getElementById('previewSection').style.display = 'block';
        
        // عرض معلومات الحجم
        const sizeKB = (base64.length / 1024).toFixed(2);
        document.getElementById('uploadResult').innerHTML = `
          <p>✅ تم رفع الصورة بنجاح!</p>
          <p>📊 حجم الرابط: ${sizeKB} KB</p>
          <p style="color:red;font-weight:bold;">⚠️ هذا الرابط مؤقت وسيختفي عند تحديث الصفحة</p>
        `;
        
        // تنظيف الذاكرة المؤقتة
        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    }
    
    function copyUrl() {
      const urlInput = document.getElementById('imageUrl');
      urlInput.select();
      urlInput.setSelectionRange(0, 99999);
      document.execCommand('copy');
      alert('✅ تم نسخ الرابط');
    }
    
    function showImage() {
      const url = document.getElementById('pasteUrl').value.trim();
      const img = document.getElementById('displayImage');
      
      if(!url) return alert('الصق الرابط أولاً');
      
      img.src = url;
      img.style.display = 'block';
    }
  </script>
</body>
</html>
